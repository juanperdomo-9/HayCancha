# Blueprint de Render: crea la API, la página y la tarea de cada minuto.
# En Render: New > Blueprint > este repo. Las variables marcadas `sync: false` se cargan a
# mano en el panel de Render (nunca en este archivo): ver docs/puesta-en-linea.md.
# Todo en Oregon, la misma región que el proyecto de Supabase.
#
# ETAPA 1 (sin dominio propio todavía): la página queda en haycancha-web.onrender.com y le
# pasa a la API todo lo que llega a /api, así el navegador ve un solo sitio y la cookie de
# sesión funciona (dos *.onrender.com distintos cuentan como sitios distintos).
# ETAPA 2 (con haycancha.com.ar): descomentar `domains`, cambiar las URL marcadas con
# "ETAPA 2" y sacar la regla /api/*. Ver docs/puesta-en-linea.md.

services:
  # --- API (api.haycancha.com.ar) ---
  - type: web
    name: haycancha-api
    runtime: python
    region: oregon
    # free para probar (se duerme sin uso); starter para uso real, así no se duerme y los
    # avisos de Mercado Pago llegan al toque.
    plan: free
    rootDir: backend
    # Las migraciones y el login de app_user se aplican en cada deploy (son idempotentes).
    buildCommand: >-
      pip install uv &&
      uv sync --frozen --no-dev &&
      uv run --frozen alembic upgrade head &&
      uv run --frozen python -m app.cli preparar-base
    startCommand: uv run --frozen uvicorn app.main:app --host 0.0.0.0 --port $PORT --proxy-headers --forwarded-allow-ips="*"
    healthCheckPath: /health
    # ETAPA 2:
    # domains:
    #   - api.haycancha.com.ar
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.11
      - key: DATABASE_URL
        sync: false
      - key: DATABASE_URL_ADMIN
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: COOKIE_SEGURA
        value: "true"
      # ETAPA 2: https://api.haycancha.com.ar y https://haycancha.com.ar
      - key: APP_BASE_URL
        value: https://haycancha-api.onrender.com
      - key: FRONTEND_URL
        value: https://haycancha-web.onrender.com
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SECRET_KEY
        sync: false
      - key: SUPABASE_BUCKET
        value: archivos
      - key: TOKEN_ENCRYPTION_KEY
        sync: false
      - key: MP_CLIENT_ID
        sync: false
      - key: MP_CLIENT_SECRET
        sync: false
      - key: MP_WEBHOOK_SECRET
        sync: false
      - key: MP_TOKENS_DE_PRUEBA
        value: "false"
      - key: EMAIL_API_KEY
        sync: false
      # ETAPA 2 (con el dominio verificado en Resend): agregar
      # EMAIL_FROM = HayCancha <avisos@mail.haycancha.com.ar>. Mientras tanto se usa
      # onboarding@resend.dev, que solo le manda emails a la cuenta de Resend.

  # --- Página (haycancha.com.ar) ---
  - type: web
    name: haycancha-web
    runtime: static
    rootDir: frontend
    buildCommand: npm ci && npm run build
    staticPublishPath: dist
    # ETAPA 2:
    # domains:
    #   - haycancha.com.ar
    #   - www.haycancha.com.ar
    routes:
      # ETAPA 1: la página le pasa /api/* a la API (mismo sitio para la cookie de sesión).
      # Si Render le dio otra dirección a la API (le agrega un sufijo si el nombre está
      # tomado), hay que cambiarla acá.
      - type: rewrite
        source: /api/*
        destination: https://haycancha-api.onrender.com/*
      # Las rutas las resuelve React (/el-potrero, /panel/..., /admin).
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      # ETAPA 2: https://api.haycancha.com.ar
      - key: VITE_API_URL
        value: /api
      # La dirección pública de la página (vista previa al compartir el link).
      # ETAPA 2: https://haycancha.com.ar
      - key: VITE_SITE_URL
        value: https://haycancha-web.onrender.com
      - key: VITE_GOOGLE_MAPS_KEY
        sync: false

  # ETAPA 2: descomentar la tarea de cada minuto (no tiene plan gratis). En la etapa 1
  # no hace falta: las reservas impagas se liberan solas al reservar o al ver la página.
#   # --- Tarea de cada minuto: vence reservas impagas, reintenta devoluciones y renueva
