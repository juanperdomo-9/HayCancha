# Blueprint de Render: crea la API, la página y la tarea de cada minuto.
# En Render: New > Blueprint > este repo. Las variables marcadas `sync: false` se cargan a
# mano en el panel de Render (nunca en este archivo): ver docs/puesta-en-linea.md.
# Todo en Oregon, la misma región que el proyecto de Supabase.

services:
  # --- API (api.haycancha.com.ar) ---
  - type: web
    name: haycancha-api
    runtime: python
    region: oregon
    # free para probar (se duerme sin uso); starter para uso real, así no se duerme y los
    # avisos de Mercado Pago llegan al toque.
    plan: free
    rootDir: backend
    # Las migraciones y el login de app_user se aplican en cada deploy (son idempotentes).
    buildCommand: >-
      pip install uv &&
      uv sync --frozen --no-dev &&
      uv run --frozen alembic upgrade head &&
      uv run --frozen python -m app.cli preparar-base
    startCommand: uv run --frozen uvicorn app.main:app --host 0.0.0.0 --port $PORT --proxy-headers --forwarded-allow-ips="*"
    healthCheckPath: /health
    domains:
      - api.haycancha.com.ar
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.11
      - key: DATABASE_URL
        sync: false
      - key: DATABASE_URL_ADMIN
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: COOKIE_SEGURA
        value: "true"
      - key: APP_BASE_URL
        value: https://api.haycancha.com.ar
      - key: FRONTEND_URL
        value: https://haycancha.com.ar
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SECRET_KEY
        sync: false
      - key: SUPABASE_BUCKET
        value: archivos
      - key: TOKEN_ENCRYPTION_KEY
        sync: false
      - key: MP_CLIENT_ID
        sync: false
      - key: MP_CLIENT_SECRET
        sync: false
      - key: MP_WEBHOOK_SECRET
        sync: false
      - key: MP_TOKENS_DE_PRUEBA
        value: "false"
      - key: EMAIL_API_KEY
        sync: false
      - key: EMAIL_FROM
        value: HayCancha <avisos@mail.haycancha.com.ar>

  # --- Página (haycancha.com.ar) ---
  - type: web
    name: haycancha-web
    runtime: static
    rootDir: frontend
    buildCommand: npm ci && npm run build
    staticPublishPath: dist
    domains:
      - haycancha.com.ar
      - www.haycancha.com.ar
    routes:
      # Las rutas las resuelve React (/el-potrero, /panel/..., /admin).
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_URL
        value: https://api.haycancha.com.ar
      - key: VITE_GOOGLE_MAPS_KEY
        sync: false

  # --- Tarea de cada minuto: vence reservas impagas, reintenta devoluciones y renueva
  # los permisos de Mercado Pago. Usa las mismas variables que la API. ---
  - type: cron
    name: haycancha-tick
    runtime: python
    region: oregon
    plan: starter
    schedule: "* * * * *"
    rootDir: backend
    buildCommand: pip install uv && uv sync --frozen --no-dev
    startCommand: uv run --frozen python -m app.jobs.tick
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.11
      - key: DATABASE_URL
        fromService: { type: web, name: haycancha-api, envVarKey: DATABASE_URL }
      - key: DATABASE_URL_ADMIN
        fromService: { type: web, name: haycancha-api, envVarKey: DATABASE_URL_ADMIN }
      - key: JWT_SECRET
        fromService: { type: web, name: haycancha-api, envVarKey: JWT_SECRET }
      - key: FRONTEND_URL
        value: https://haycancha.com.ar
      - key: APP_BASE_URL
        value: https://api.haycancha.com.ar
      - key: TOKEN_ENCRYPTION_KEY
        fromService: { type: web, name: haycancha-api, envVarKey: TOKEN_ENCRYPTION_KEY }
      - key: MP_CLIENT_ID
        fromService: { type: web, name: haycancha-api, envVarKey: MP_CLIENT_ID }
      - key: MP_CLIENT_SECRET
        fromService: { type: web, name: haycancha-api, envVarKey: MP_CLIENT_SECRET }
      - key: EMAIL_API_KEY
        fromService: { type: web, name: haycancha-api, envVarKey: EMAIL_API_KEY }
      - key: EMAIL_FROM
        value: HayCancha <avisos@mail.haycancha.com.ar>
