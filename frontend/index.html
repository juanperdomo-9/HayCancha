<!doctype html>
<html lang="es-AR">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#F1E9D8" />
    <meta name="description" content="Reservá cancha en segundos: horarios libres de verdad y seña con Mercado Pago." />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,100..900&family=Instrument+Sans:wght@400..700&display=swap" />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@500..900&display=swap" />
    <title>HayCancha</title>
    <script>
      // Modo claro u oscuro antes de pintar (ver src/theme/modo.ts).
      try {
        var m = localStorage.getItem('hc-modo')
        if (m !== 'claro' && m !== 'oscuro') m = matchMedia('(prefers-color-scheme: dark)').matches ? 'oscuro' : 'claro'
        document.documentElement.dataset.tema = m
        if (m === 'oscuro') document.querySelector('meta[name="theme-color"]').setAttribute('content', '#0E1511')
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
